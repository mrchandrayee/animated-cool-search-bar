<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Animated Cool Search Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>Animated<br>Cool Search Bar</h1>
  </header>

  <main class="demo-stage">
    <form class="search-box" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search..." aria-label="Search">
      <button type="submit" aria-label="Submit search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.7"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
      </button>
    </form>
    <p class="search-feedback" id="searchFeedback" role="status" aria-live="polite"></p>
    <div class="video-caption">Comment "Search" for code</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
